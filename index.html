<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>柏青哥 Pachinko — 長輩休閒版</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#2a1245">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root {
    --purple-dark: #2a1245;
    --purple-mid: #3d1a63;
    --gold: #ffcc4d;
    --orange: #ff8c42;
    --text-color: #fff;
  }
  html[data-theme="retro"] {
    --purple-dark: #2b0a0a;
    --purple-mid: #4a1414;
    --gold: #ffd166;
    --orange: #ff4d4d;
    --text-color: #fff;
  }
  html[data-theme="day"] {
    --purple-dark: #fff8e7;
    --purple-mid: #fff1d6;
    --gold: #b8860b;
    --orange: #d2691e;
    --text-color: #2a1245;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--purple-dark);
    color: var(--text-color);
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    max-width: 420px;
    margin: 0 auto;
    padding: 12px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 4px 0;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(255,204,77,0.5);
  }
  /* 計分板 */
  #scoreboard {
    display: flex;
    justify-content: space-between;
    background: var(--purple-mid);
    border-radius: 12px;
    padding: 10px 14px;
    border: 2px solid var(--gold);
  }
  .score-item { text-align: center; flex: 1; }
  .score-label { font-size: 14px; color: #d8c4ff; }
  .score-value { font-size: 32px; font-weight: bold; color: var(--gold); }

  /* 老虎機 */
  #slotMachine {
    display: flex;
    justify-content: center;
    gap: 8px;
    background: #1a0a2e;
    border: 3px solid var(--gold);
    border-radius: 12px;
    padding: 10px;
  }
  .reel {
    width: 64px;
    height: 64px;
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    border: 2px solid #6a4fa0;
  }
  #slotMachine.spinning .reel { animation: shake 0.1s infinite; }
  @keyframes shake { 0%,100%{transform:translateY(0);} 50%{transform:translateY(2px);} }

  /* Canvas */
  #boardWrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 0 16px rgba(255,204,77,0.3);
  }
  canvas {
    display: block;
    width: 100%;
    background: #241041;
  }
  #boardWrap.fever { box-shadow: 0 0 30px 6px var(--orange); }

  /* 訊息列 */
  #messageBar {
    min-height: 22px;
    text-align: center;
    font-size: 16px;
    color: var(--gold);
    font-weight: bold;
  }

  /* 控制區 */
  #controls { display: flex; flex-direction: column; gap: 10px; }
  #powerRow { display: flex; align-items: center; gap: 10px; }
  #powerRow label { font-size: 16px; white-space: nowrap; }
  #powerSlider { flex: 1; height: 30px; }
  #powerValue { font-size: 20px; font-weight: bold; min-width: 46px; text-align: right; color: var(--gold); }

  #launchBtn {
    width: 100%;
    height: 60px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--gold), var(--orange));
    color: #2a1245;
    cursor: pointer;
  }
  #launchBtn:active { transform: scale(0.98); }
  #launchBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btnRow { display: flex; gap: 8px; }
  .smallBtn {
    flex: 1;
    height: 48px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--purple-mid);
    color: var(--text-color);
    cursor: pointer;
  }

  /* 統計面板 */
  #statsPanel {
    background: var(--purple-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: none;
    font-size: 15px;
    line-height: 1.9;
  }
  #statsPanel.show { display: block; }

  /* 設定面板 */
  #settingsPanel {
    background: var(--purple-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: none;
    gap: 10px;
    flex-direction: column;
  }
  #settingsPanel.show { display: flex; }
  .settingRow { display: flex; align-items: center; gap: 10px; }
  .settingRow > span:first-child { font-size: 16px; white-space: nowrap; width: 56px; }
  .settingRow .btnRow { flex: 1; }
  #volumeSlider { flex: 1; height: 30px; }
  #volumeValue { font-size: 18px; font-weight: bold; min-width: 34px; text-align: right; color: var(--gold); }
  #nicknameInput {
    flex: 1;
    height: 44px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--purple-dark);
    color: var(--text-color);
    padding: 0 12px;
  }
  #nicknameInput::placeholder { color: #b9a3e0; }
  .toggleBtn {
    flex: 1;
    height: 44px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--purple-dark);
    color: var(--text-color);
    cursor: pointer;
  }
  .toggleBtn.active {
    background: linear-gradient(180deg, var(--gold), var(--orange));
    color: #2a1245;
    font-weight: bold;
  }

  #xiaoMaliBtn {
    width: 100%;
    height: 52px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 12px;
    border: 2px solid var(--gold);
    background: linear-gradient(180deg, #ff6b9d, #c92a5b);
    color: #fff;
    cursor: pointer;
  }
  #xiaoMaliBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 成就面板 */
  #achievePanel {
    background: var(--purple-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: none;
    font-size: 15px;
    line-height: 1.7;
  }
  #achievePanel.show { display: block; }
  .achieveItem { opacity: 0.4; }
  .achieveItem.unlocked { opacity: 1; color: var(--gold); }

  /* 成就解鎖 Toast */
  #achieveToast {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%) translateY(-40px);
    background: linear-gradient(180deg, var(--gold), var(--orange));
    color: #2a1245;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 10px;
    z-index: 60;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    max-width: 90%;
    text-align: center;
  }
  #achieveToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 小瑪莉水果盤 Modal */
  #xiaoMaliOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    align-items: center; justify-content: center;
    z-index: 55;
  }
  #xiaoMaliOverlay.show { display: flex; }
  #xiaoMaliBox {
    background: var(--purple-mid);
    border: 3px solid var(--gold);
    border-radius: 14px;
    padding: 20px;
    max-width: 340px;
    text-align: center;
  }
  #xiaoMaliBox h2 { color: var(--gold); margin: 0 0 12px; font-size: 20px; }
  #maliGrid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 16px;
  }
  .maliCell {
    height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a0a2e;
    border: 2px solid #6a4fa0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: bold;
  }
  .maliCell.center { background: #3d1a63; }
  .maliCell.lit { border-color: var(--gold); background: var(--orange); color: #2a1245; }
  #maliResult { min-height: 26px; font-size: 18px; color: var(--gold); font-weight: bold; margin-bottom: 12px; }
  @media (prefers-reduced-motion: reduce) {
    #achieveToast { transition: none; }
  }

  /* 字體大小：特大模式 */
  #app.fontXL .score-value { font-size: 40px; }
  #app.fontXL .score-label { font-size: 17px; }
  #app.fontXL #messageBar { font-size: 20px; }
  #app.fontXL #launchBtn { font-size: 28px; height: 68px; }
  #app.fontXL .smallBtn, #app.fontXL .toggleBtn { font-size: 18px; height: 54px; }
  #app.fontXL #powerRow label, #app.fontXL #powerValue { font-size: 20px; }
  #app.fontXL #statsPanel, #app.fontXL .settingRow > span:first-child { font-size: 18px; }
  #app.fontXL #xiaoMaliBtn { font-size: 19px; height: 58px; }
  #app.fontXL #achievePanel { font-size: 17px; }
  #app.fontXL #nicknameInput { font-size: 18px; height: 50px; }
  #app.fontXL #volumeValue { font-size: 20px; }

  /* 二次確認 Modal */
  #confirmOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  #confirmOverlay.show { display: flex; }
  #confirmBox {
    background: var(--purple-mid);
    border: 3px solid var(--gold);
    border-radius: 14px;
    padding: 24px;
    max-width: 320px;
    text-align: center;
  }
  #confirmBox p { font-size: 18px; margin-bottom: 20px; }
  #confirmBox .btnRow { gap: 12px; }

  #feverBanner {
    display: none;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: var(--orange);
    background: #1a0a2e;
    padding: 6px;
    border-radius: 10px;
    animation: pulse 0.6s infinite alternate;
  }
  #feverBanner.show { display: block; }
  @keyframes pulse { from{opacity:1;} to{opacity:0.5;} }

  @media (prefers-reduced-motion: reduce) {
    #slotMachine.spinning .reel { animation: none; }
    #feverBanner { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎰 柏青哥 Pachinko 🎰</h1>

  <div id="scoreboard">
    <div class="score-item">
      <div class="score-label">籌碼</div>
      <div class="score-value" id="chipsValue">1000</div>
    </div>
    <div class="score-item">
      <div class="score-label">本次得分</div>
      <div class="score-value" id="sessionScoreValue">0</div>
    </div>
  </div>

  <div id="feverBanner">🔥 FEVER TIME 🔥</div>

  <div id="slotMachine">
    <div class="reel" id="reel0">🍒</div>
    <div class="reel" id="reel1">🍋</div>
    <div class="reel" id="reel2">⭐</div>
  </div>

  <div id="boardWrap">
    <canvas id="board" width="360" height="520"></canvas>
  </div>

  <div id="messageBar">按「發射」讓彈珠落下吧！</div>

  <div id="controls">
    <div id="powerRow">
      <label for="powerSlider">力道</label>
      <input type="range" id="powerSlider" min="0" max="100" value="50">
      <span id="powerValue">50</span>
    </div>
    <button id="launchBtn">🚀 發射（按住可連發）</button>
    <div class="btnRow">
      <button class="smallBtn" id="soundBtn">🔊 音效</button>
      <button class="smallBtn" id="statsBtn">📊 統計</button>
    </div>
    <div class="btnRow">
      <button class="smallBtn" id="settingsBtn">⚙️ 設定</button>
      <button class="smallBtn" id="resetBtn">🔄 重新開始</button>
    </div>
    <div class="btnRow">
      <button class="smallBtn" id="musicBtn">🎵 音樂</button>
      <button class="smallBtn" id="achieveBtn">🏆 成就</button>
    </div>
    <button id="xiaoMaliBtn">🍓 小瑪莉水果盤（20 籌碼）</button>
  </div>

  <div id="statsPanel">
    <div>歷史總得分：<b id="statTotalScore">0</b></div>
    <div>歷史 Fever 次數：<b id="statTotalFever">0</b></div>
    <div>歷史發射彈珠數：<b id="statTotalBalls">0</b></div>
  </div>

  <div id="achievePanel"></div>

  <div id="settingsPanel">
    <div class="settingRow">
      <span>速度</span>
      <div class="btnRow">
        <button class="toggleBtn" data-gravity="1.2">慢</button>
        <button class="toggleBtn" data-gravity="1.6">中</button>
        <button class="toggleBtn" data-gravity="2.0">快</button>
      </div>
    </div>
    <div class="settingRow">
      <span>字體</span>
      <div class="btnRow">
        <button class="toggleBtn" data-font="normal">大</button>
        <button class="toggleBtn" data-font="xl">特大</button>
      </div>
    </div>
    <div class="settingRow">
      <span>配色</span>
      <div class="btnRow">
        <button class="toggleBtn" data-theme="classic">經典</button>
        <button class="toggleBtn" data-theme="retro">復古紅</button>
        <button class="toggleBtn" data-theme="day">明亮</button>
      </div>
    </div>
    <div class="settingRow">
      <span>音量</span>
      <input type="range" id="volumeSlider" min="0" max="100" value="70">
      <span id="volumeValue">70</span>
    </div>
    <div class="settingRow">
      <span>暱稱</span>
      <input type="text" id="nicknameInput" maxlength="10" placeholder="輸入暱稱（選填）">
    </div>
  </div>
</div>

<div id="confirmOverlay">
  <div id="confirmBox">
    <p>確定要重新開始嗎？<br>目前籌碼與紀錄將會清空。</p>
    <div class="btnRow">
      <button class="smallBtn" id="confirmYes">確定重來</button>
      <button class="smallBtn" id="confirmNo">取消</button>
    </div>
  </div>
</div>

<div id="xiaoMaliOverlay">
  <div id="xiaoMaliBox">
    <h2>🍓 小瑪莉水果盤</h2>
    <div id="maliGrid">
      <div class="maliCell" data-idx="0">30</div>
      <div class="maliCell" data-idx="1">50</div>
      <div class="maliCell" data-idx="2">100</div>
      <div class="maliCell" data-idx="3">20</div>
      <div class="maliCell center" data-idx="4">🍓</div>
      <div class="maliCell" data-idx="5">80</div>
      <div class="maliCell" data-idx="6">80</div>
      <div class="maliCell" data-idx="7">50</div>
      <div class="maliCell" data-idx="8">200</div>
    </div>
    <div id="maliResult">燈號跑動中，看它停在哪一格！</div>
    <div class="btnRow">
      <button class="smallBtn" id="maliCloseBtn">關閉</button>
    </div>
  </div>
</div>

<div id="achieveToast"></div>

<script>
(function () {
  'use strict';

  // ---------- 存檔 ----------
  const SAVE_KEY = 'pachinko_save_v1';
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function defaultSave() {
    return {
      chips: 1000,
      totalScore: 0,
      totalFever: 0,
      totalBalls: 0,
      totalHoles: 0,
      soundOn: true,
      musicOn: false,
      gravity: 1.6,
      fontSize: 'normal',
      lastLoginDate: null,
      achievements: {},
      maliPlays: 0,
      masterVolume: 70,
      nickname: '',
      theme: 'classic'
    };
  }
  let save = Object.assign(defaultSave(), loadSave() || {});

  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }

  // 每日登入禮
  let dailyGiftMsg = null;
  const today = todayStr();
  if (save.lastLoginDate !== today) {
    save.chips += 1000;
    save.lastLoginDate = today;
    dailyGiftMsg = '🎁 每日禮 +1000 籌碼！';
    persist();
  }

  // 時段問候
  function getGreetingWord() {
    const h = new Date().getHours();
    if (h >= 5 && h < 11) return '早安';
    if (h >= 11 && h < 14) return '午安';
    if (h >= 14 && h < 18) return '下午好';
    if (h >= 18 && h < 22) return '晚安';
    return '夜深了，早點休息喔';
  }
  function buildGreeting() {
    const name = save.nickname ? save.nickname + '，' : '';
    return name + getGreetingWord() + '！';
  }

  // ---------- 遊戲狀態 ----------
  const gameState = {
    chips: save.chips,
    sessionScore: 0,
    feverCount: 0,
    isFever: false,
    feverEndTime: null,
    missStreak: 0,
    soundOn: save.soundOn,
    musicOn: save.musicOn,
  };

  // ---------- DOM ----------
  const chipsValueEl = document.getElementById('chipsValue');
  const sessionScoreValueEl = document.getElementById('sessionScoreValue');
  const messageBarEl = document.getElementById('messageBar');
  const launchBtn = document.getElementById('launchBtn');
  const powerSlider = document.getElementById('powerSlider');
  const powerValueEl = document.getElementById('powerValue');
  const soundBtn = document.getElementById('soundBtn');
  const statsBtn = document.getElementById('statsBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statsPanel = document.getElementById('statsPanel');
  const boardWrap = document.getElementById('boardWrap');
  const feverBanner = document.getElementById('feverBanner');
  const slotMachineEl = document.getElementById('slotMachine');
  const reelEls = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const statTotalScore = document.getElementById('statTotalScore');
  const statTotalFever = document.getElementById('statTotalFever');
  const statTotalBalls = document.getElementById('statTotalBalls');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const appEl = document.getElementById('app');
  const gravityBtns = Array.from(document.querySelectorAll('[data-gravity]'));
  const fontBtns = Array.from(document.querySelectorAll('[data-font]'));
  const musicBtn = document.getElementById('musicBtn');
  const achieveBtn = document.getElementById('achieveBtn');
  const achievePanel = document.getElementById('achievePanel');
  const achieveToast = document.getElementById('achieveToast');
  const xiaoMaliBtn = document.getElementById('xiaoMaliBtn');
  const xiaoMaliOverlay = document.getElementById('xiaoMaliOverlay');
  const maliCloseBtn = document.getElementById('maliCloseBtn');
  const maliResult = document.getElementById('maliResult');
  const maliCells = Array.from(document.querySelectorAll('.maliCell'));
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeValueEl = document.getElementById('volumeValue');
  const nicknameInput = document.getElementById('nicknameInput');
  const themeBtns = Array.from(document.querySelectorAll('[data-theme]'));

  function updateHud() {
    chipsValueEl.textContent = gameState.chips;
    sessionScoreValueEl.textContent = gameState.sessionScore;
    statTotalScore.textContent = save.totalScore;
    statTotalFever.textContent = save.totalFever;
    statTotalBalls.textContent = save.totalBalls;
  }
  function showMessage(msg) {
    messageBarEl.textContent = msg;
  }
  updateHud();
  showMessage(dailyGiftMsg ? buildGreeting() + ' ' + dailyGiftMsg : buildGreeting());
  nicknameInput.value = save.nickname || '';

  // ---------- 音效（Web Audio 合成） ----------
  let audioCtx = null;
  let masterGainNode = null;
  function ctx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGainNode = audioCtx.createGain();
      masterGainNode.gain.value = (save.masterVolume != null ? save.masterVolume : 70) / 100;
      masterGainNode.connect(audioCtx.destination);
    }
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainVal, pan) {
    if (!gameState.soundOn) return;
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = gainVal != null ? gainVal : 0.15;
    let outNode = masterGainNode;
    if (pan != null && c.createStereoPanner) {
      const panNode = c.createStereoPanner();
      panNode.pan.value = Math.max(-1, Math.min(1, pan));
      panNode.connect(masterGainNode);
      outNode = panNode;
    }
    osc.connect(gain).connect(outNode);
    const t0 = c.currentTime + start;
    osc.start(t0);
    gain.gain.setValueAtTime(gain.gain.value, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxLaunch() { tone(440, 0, 0.05, 'sine', 0.12); }
  function sfxSmallHole(pan) { tone(660, 0, 0.08, 'sine', null, pan); tone(880, 0.08, 0.1, 'sine', null, pan); }
  function sfxBigHole(pan) { tone(880, 0, 0.08, 'sine', null, pan); tone(1100, 0.08, 0.08, 'sine', null, pan); tone(1320, 0.16, 0.12, 'sine', null, pan); }

  // ---------- 語音回饋（Web Speech API） ----------

  soundBtn.addEventListener('click', () => {

  // ---------- 背景音樂（Web Audio 循環合成） ----------
  const MUSIC_NOTES = [523, 659, 784, 659, 587, 698, 880, 698];
  let musicTimer = null;
  let musicStep = 0;
  function playMusicStep() {
    if (!gameState.musicOn) return;
    const c = ctx();
    const freq = MUSIC_NOTES[musicStep % MUSIC_NOTES.length];
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.value = 0.05;
    osc.connect(gain).connect(masterGainNode);
    const t0 = c.currentTime;
    osc.start(t0);
    gain.gain.setValueAtTime(0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.55);
    osc.stop(t0 + 0.6);
    musicStep++;
  }
  function startMusic() {
    if (musicTimer) return;
    musicTimer = setInterval(playMusicStep, 600);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }
  function updateMusicBtn() {
    musicBtn.textContent = gameState.musicOn ? '🎵 音樂中' : '🎵 音樂';
  }
  musicBtn.addEventListener('click', () => {

    save.musicOn = gameState.musicOn;

    else stopMusic();
  });

  // ---------- Matter.js 物理設定 ----------

  const engine = Engine.create();
  engine.gravity.y = save.gravity;

  const CANVAS_W = 360, CANVAS_H = 520;

  World.add(world, [
    Bodies.rectangle(-5, CANVAS_H / 2, 10, CANVAS_H, wallOpts),

  // 釘板（交錯蜂巢式）

  const PIN_SPACING = 32;
  const PIN_ROWS = 12;

  const pins = [];
  for (let row = 0; row < PIN_ROWS; row++) {
    const y = PIN_TOP + row * 28;
    const offsetX = (row % 2 === 0) ? 0 : PIN_SPACING / 2;
    for (let col = 0; col < 10; col++) {
      const x = 20 + col * PIN_SPACING + offsetX;
      if (x < 16 || x > CANVAS_W - 16) continue;
      const pin = Bodies.circle(x, y, PIN_RADIUS, {

  // ---------- 彈珠管理 ----------
  const balls = [];

  const TRAIL_LENGTH = 10;
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- Fever 煙火／彩帶粒子特效 ----------
  const PARTICLE_COLORS = ['#ffcc4d', '#ff6b6b', '#48dbfb', '#1dd1a1', '#ff9ff3', '#ff8c42'];
  let particles = [];
  function spawnFireworks() {
    if (reduceMotion) return;
    for (let i = 0; i < 50; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      particles.push({
        x: CANVAS_W / 2 + (Math.random() * 60 - 30),
        y: 120 + Math.random() * 60,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        color: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)],
        life: 50 + Math.random() * 30,
        maxLife: 80
      });
    }
  }
  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }
  function renderParticles() {
    particles.forEach(p => {
      ctx2d.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx2d.fillStyle = p.color;
      ctx2d.beginPath();
      ctx2d.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx2d.fill();
    });
    ctx2d.globalAlpha = 1;
  }

  function spawnBall(power) {
    const spawnX = 340 - (power / 100) * 260 + (Math.random() * 10 - 5);
    const ball = Bodies.circle(spawnX, 30, BALL_RADIUS, {
      restitution: 0.55,
      friction: 0.02,
      frictionAir: 0.001,
      label: 'ball'
    });

    ball.spawnTime = Date.now();
    ball.color = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
    ball.trail = [];
    Body.setVelocity(ball, { x: (Math.random() * 1.2 - 0.6), y: 2 });
    World.add(world, ball);
    balls.push(ball);
    save.totalBalls++;
  }

  function removeBall(ball) {
    const idx = balls.indexOf(ball);
    if (idx >= 0) balls.splice(idx, 1);
    World.remove(world, ball);

  // ---------- 老虎機 ----------
  const SYMBOLS = ['7️⃣', '🍒', '🍋', '⭐', '🔔', '🍇', '💎'];
  let slotSpinning = false;

  function countSymbol(arr, sym) { return arr.filter(s => s === sym).length; }
  function isSpecialPattern(arr) {
    return countSymbol(arr, '7️⃣') === 3 || countSymbol(arr, '🍒') === 3 || countSymbol(arr, '7️⃣') === 2;
  }
  function randomResult() {
    let r = [0, 0, 0].map(() => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
    let guard = 0;
    while (isSpecialPattern(r) && guard++ < 20) {
      r = [0, 0, 0].map(() => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
    }
    return r;
  }

  function spinSlot(winProb) {
    if (slotSpinning) return;
    slotSpinning = true;
    slotMachineEl.classList.add('spinning');

    const forceWin = gameState.missStreak >= 40;
    let result;
    if (forceWin || Math.random() < winProb) {
      result = ['7️⃣', '7️⃣', '7️⃣'];
    } else {
      const r = Math.random();
      if (r < 0.05) {
        result = ['🍒', '🍒', '🍒'];
      } else if (r < 0.12) {
        const nonSeven = SYMBOLS.slice(1);
        const other = nonSeven[Math.floor(Math.random() * nonSeven.length)];
        result = ['7️⃣', '7️⃣', '7️⃣'];
        result[Math.floor(Math.random() * 3)] = other;
      } else {
        result = randomResult();
      }
    }

    const spinIntervals = [];
    reelEls.forEach((el, i) => {
      spinIntervals[i] = setInterval(() => {
        el.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      }, 70);
    });

    const stopDelays = [600, 1000, 1400];
    reelEls.forEach((el, i) => {
      setTimeout(() => {
        clearInterval(spinIntervals[i]);
        el.textContent = result[i];
        if (i === reelEls.length - 1) {
          slotSpinning = false;
          slotMachineEl.classList.remove('spinning');
          const sevenCount = countSymbol(result, '7️⃣');
          const cherryCount = countSymbol(result, '🍒');
          if (sevenCount === 3) {
            gameState.missStreak = 0;
            sfx777();
            showMessage('🎉 777 中獎！進入 FEVER！');
            startFever();
          } else if (cherryCount === 3) {
            gameState.missStreak++;
            gameState.chips += 100;
            save.chips = gameState.chips;
            sfxSmallWin();
            speak('小獎中囉！');
            showMessage('🍒🍒🍒 櫻桃連線！+100 籌碼');
            updateHud();
            persist();
          } else if (sevenCount === 2) {
            gameState.missStreak++;
            gameState.chips += 50;
            save.chips = gameState.chips;
            sfxSmallWin();
            showMessage('7️⃣7️⃣ 雙 7 小獎！+50 籌碼');
            updateHud();
            persist();
          } else {
            gameState.missStreak++;
            sfxMiss();
            showMessage('可惜，再試一次！');
          }
          checkAchievements();
        }
      }, stopDelays[i]);
    });
  }

  function handleHole(ball, holeBody) {

  // ---------- 小瑪莉水果盤（Phase 4 加值內容） ----------
  const MALI_COST = 20;
  // 3x3 格子索引，跳過中央第 4 格，依順時針排列成環
  const MALI_RING = [0, 1, 2, 5, 8, 7, 6, 3];
  const MALI_PRIZES = { 0: 30, 1: 50, 2: 100, 3: 20, 5: 80, 6: 80, 7: 50, 8: 200 };
  let maliSpinning = false;

  function pickMaliIndex() {
    // 獎金越高機率越低，維持「無挫敗」設計：最低獎恰等於花費，不會淨損失
    const weights = MALI_RING.map(idx => Math.max(1, 100 - MALI_PRIZES[idx]));
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < MALI_RING.length; i++) {
      r -= weights[i];
      if (r <= 0) return MALI_RING[i];
    }
    return MALI_RING[0];
  }

  function openMali() {
    if (maliSpinning) return;
    if (gameState.chips < MALI_COST) {
      checkAutoRefill();
      if (gameState.chips < MALI_COST) return;
    }
    gameState.chips -= MALI_COST;
    save.chips = gameState.chips;
    save.maliPlays++;
    updateHud();
    persist();

    maliCells.forEach(c => c.classList.remove('lit'));
    maliResult.textContent = '燈號跑動中，看它停在哪一格！';
    xiaoMaliOverlay.classList.add('show');
    maliSpinning = true;

    const targetIdx = pickMaliIndex();

    function finishMali() {
      maliCells.forEach(c => c.classList.remove('lit'));
      const cellEl = maliCells.find(c => Number(c.dataset.idx) === targetIdx);
      if (cellEl) cellEl.classList.add('lit');
      maliSpinning = false;
      const prize = MALI_PRIZES[targetIdx];
      gameState.chips += prize;
      save.chips = gameState.chips;
      gameState.sessionScore += prize;
      save.totalScore += prize;
      updateHud();
      persist();
      sfxMaliWin();
      maliResult.textContent = '🎉 停在 ' + prize + '！獲得 ' + prize + ' 籌碼';
      if (prize >= 200) speak('恭喜大獎！');
      checkAchievements();
    }

    if (reduceMotion) {
      // 減少動態效果時直接顯示結果，不播放跑燈動畫
      finishMali();
      return;
    }

    const targetPos = MALI_RING.indexOf(targetIdx);
    // 總共跑動的格數：至少繞 2 圈再停到目標格，速度逐漸變慢
    const totalSteps = MALI_RING.length * 2 + targetPos + 1;
    let step = 0;

    function tick() {
      if (step >= totalSteps) { finishMali(); return; }
      maliCells.forEach(c => c.classList.remove('lit'));
      const cellIdx = MALI_RING[step % MALI_RING.length];
      const cellEl = maliCells.find(c => Number(c.dataset.idx) === cellIdx);
      if (cellEl) cellEl.classList.add('lit');
      sfxMaliTick();
      step++;
      const remain = totalSteps - step;
      const delay = remain < 6 ? 70 + (6 - remain) * 60 : 70;
      setTimeout(tick, delay);
    }
    tick();
  }

  xiaoMaliBtn.addEventListener('click', openMali);
  maliCloseBtn.addEventListener('click', () => {
    if (maliSpinning) return;
    xiaoMaliOverlay.classList.remove('show');
  });

  // ---------- 重新開始（二次確認） ----------
  resetBtn.addEventListener('click', () => {
    confirmOverlay.classList.add('show');
  });
  confirmNo.addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
  });
  confirmYes.addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
    save = defaultSave();
    save.lastLoginDate = todayStr();
    persist();
    gameState.chips = save.chips;
    gameState.sessionScore = 0;
    gameState.feverCount = 0;
    gameState.missStreak = 0;
    if (gameState.isFever) endFever();
    if (gameState.musicOn) { gameState.musicOn = false; stopMusic(); updateMusicBtn(); }
    particles = [];
    balls.slice().forEach(removeBall);
    renderAchievements();
    nicknameInput.value = '';
    volumeSlider.value = save.masterVolume;
    volumeValueEl.textContent = save.masterVolume;
    if (masterGainNode) masterGainNode.gain.value = save.masterVolume / 100;
    document.documentElement.setAttribute('data-theme', save.theme);
    syncSettingButtons();
    updateHud();
    showMessage(buildGreeting());
  });

  // ---------- beforeunload 存檔 ----------
  window.addEventListener('beforeunload', () => {
    save.chips = gameState.chips;
    persist();
  });

  // ---------- 主迴圈 ----------
  const PHYSICS_SUBSTEPS = 4; // 用更小的時間步分次計算物理，避免高速小彈珠穿過釘子
  const MAX_BALL_SPEED = 14; // 限制最高速度，進一步降低穿模風險
  function loop() {
    for (let s = 0; s < PHYSICS_SUBSTEPS; s++) {
      Engine.update(engine, (1000 / 60) / PHYSICS_SUBSTEPS);
      balls.forEach(b => {
        const speed = Math.hypot(b.velocity.x, b.velocity.y);
        if (speed > MAX_BALL_SPEED) {
          const scale = MAX_BALL_SPEED / speed;
          Body.setVelocity(b, { x: b.velocity.x * scale, y: b.velocity.y * scale });
        }
      });
    }

    // 回收出界彈珠（未入洞 = 0 分）
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (!reduceMotion) {
        b.trail.push({ x: b.position.x, y: b.position.y });
        if (b.trail.length > TRAIL_LENGTH) b.trail.shift();
      }
      if (b.position.y > CANVAS_H + 20) {
        if (!b.scored) {
          showMessage('可惜，掉出去了，再接再厲！');
        }
        removeBall(b);
      }
    }

    updateParticles();
    render();
    requestAnimationFrame(loop);
  }

  const THEME_COLORS = {
    classic: { bg: '#241041', feverBg1: '#4a1f7a', feverBg2: '#241041', pin: '#d8c4ff', feverPin: '#ff8c42' },
    retro:   { bg: '#2b0a0a', feverBg1: '#5c1a1a', feverBg2: '#2b0a0a', pin: '#ffd9a0', feverPin: '#ff4d4d' },
    day:     { bg: '#fff8e7', feverBg1: '#ffe1b3', feverBg2: '#fff8e7', pin: '#7a4b00', feverPin: '#ff7f11' }
  };

  function render() {
    const theme = THEME_COLORS[save.theme] || THEME_COLORS.classic;
    // 背景
    if (gameState.isFever) {
      const grad = ctx2d.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2, 20, CANVAS_W / 2, CANVAS_H / 2, 300);
      grad.addColorStop(0, theme.feverBg1);
      grad.addColorStop(1, theme.feverBg2);
      ctx2d.fillStyle = grad;
    } else {
      ctx2d.fillStyle = theme.bg;
    }
    ctx2d.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // 釘子
    ctx2d.fillStyle = gameState.isFever ? theme.feverPin : theme.pin;
    pins.forEach(p => {
      ctx2d.beginPath();
      ctx2d.arc(p.position.x, p.position.y, PIN_RADIUS, 0, Math.PI * 2);
      ctx2d.fill();
    });

    // 洞口
    holeBodies.forEach(hb => {
      const vertices = hb.vertices;
      const minX = Math.min(...vertices.map(v => v.x));
      const maxX = Math.max(...vertices.map(v => v.x));
      const minY = Math.min(...vertices.map(v => v.y));
      const maxY = Math.max(...vertices.map(v => v.y));
      const isBig = hb.holeDef.type === 'big';
      ctx2d.fillStyle = isBig ? '#ffcc4d' : '#8a6fd6';
      ctx2d.fillRect(minX, minY, maxX - minX, maxY - minY);
      ctx2d.fillStyle = '#2a1245';
      ctx2d.font = 'bold 11px sans-serif';
      ctx2d.textAlign = 'center';
      const label = isBig ? (gameState.isFever ? '+150' : '+50') : (hb.holeDef.type === 'small-inner' ? '+10' : '+5');
      ctx2d.fillText(label, (minX + maxX) / 2, (minY + maxY) / 2 + 4);
    });

    // 彈珠殘影軌跡
    if (!reduceMotion) {
      balls.forEach(b => {
        b.trail.forEach((p, i) => {
          const alpha = (i / b.trail.length) * 0.35;
          ctx2d.beginPath();
          ctx2d.arc(p.x, p.y, BALL_RADIUS * 0.7, 0, Math.PI * 2);
          ctx2d.fillStyle = b.color;
          ctx2d.globalAlpha = alpha;
          ctx2d.fill();
        });
      });
      ctx2d.globalAlpha = 1;
    }

    // 彈珠
    balls.forEach(b => {
      ctx2d.beginPath();
      ctx2d.arc(b.position.x, b.position.y, BALL_RADIUS, 0, Math.PI * 2);
      const grad = ctx2d.createRadialGradient(
        b.position.x - 2, b.position.y - 2, 1,
        b.position.x, b.position.y, BALL_RADIUS
      );
      grad.addColorStop(0, '#fff');
      grad.addColorStop(1, b.color);
      ctx2d.fillStyle = grad;
      ctx2d.fill();
    });

    // Fever 煙火粒子
    renderParticles();
  }

  requestAnimationFrame(loop);

  // ---------- PWA：註冊 Service Worker ----------
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
})();
</script>
</body>
</html>
