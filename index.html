<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>柏青哥 Pachinko — 長輩休閒版</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<style>
  :root {
    --purple-dark: #2a1245;
    --purple-mid: #3d1a63;
    --gold: #ffcc4d;
    --orange: #ff8c42;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--purple-dark);
    color: #fff;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    max-width: 420px;
    margin: 0 auto;
    padding: 12px 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 4px 0;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(255,204,77,0.5);
  }
  /* 計分板 */
  #scoreboard {
    display: flex;
    justify-content: space-between;
    background: var(--purple-mid);
    border-radius: 12px;
    padding: 10px 14px;
    border: 2px solid var(--gold);
  }
  .score-item { text-align: center; flex: 1; }
  .score-label { font-size: 14px; color: #d8c4ff; }
  .score-value { font-size: 32px; font-weight: bold; color: var(--gold); }

  /* 老虎機 */
  #slotMachine {
    display: flex;
    justify-content: center;
    gap: 8px;
    background: #1a0a2e;
    border: 3px solid var(--gold);
    border-radius: 12px;
    padding: 10px;
  }
  .reel {
    width: 64px;
    height: 64px;
    background: #000;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    border: 2px solid #6a4fa0;
  }
  #slotMachine.spinning .reel { animation: shake 0.1s infinite; }
  @keyframes shake { 0%,100%{transform:translateY(0);} 50%{transform:translateY(2px);} }

  /* Canvas */
  #boardWrap {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid var(--gold);
    box-shadow: 0 0 16px rgba(255,204,77,0.3);
  }
  canvas {
    display: block;
    width: 100%;
    background: #241041;
  }
  #boardWrap.fever { box-shadow: 0 0 30px 6px var(--orange); }

  /* 訊息列 */
  #messageBar {
    min-height: 22px;
    text-align: center;
    font-size: 16px;
    color: var(--gold);
    font-weight: bold;
  }

  /* 控制區 */
  #controls { display: flex; flex-direction: column; gap: 10px; }
  #powerRow { display: flex; align-items: center; gap: 10px; }
  #powerRow label { font-size: 16px; white-space: nowrap; }
  #powerSlider { flex: 1; height: 30px; }
  #powerValue { font-size: 20px; font-weight: bold; min-width: 46px; text-align: right; color: var(--gold); }

  #launchBtn {
    width: 100%;
    height: 60px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 14px;
    background: linear-gradient(180deg, var(--gold), var(--orange));
    color: #2a1245;
    cursor: pointer;
  }
  #launchBtn:active { transform: scale(0.98); }
  #launchBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btnRow { display: flex; gap: 8px; }
  .smallBtn {
    flex: 1;
    height: 48px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--purple-mid);
    color: #fff;
    cursor: pointer;
  }

  /* 統計面板 */
  #statsPanel {
    background: var(--purple-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: none;
    font-size: 15px;
    line-height: 1.9;
  }
  #statsPanel.show { display: block; }

  /* 設定面板 */
  #settingsPanel {
    background: var(--purple-mid);
    border: 2px solid var(--gold);
    border-radius: 12px;
    padding: 12px;
    display: none;
    gap: 10px;
    flex-direction: column;
  }
  #settingsPanel.show { display: flex; }
  .settingRow { display: flex; align-items: center; gap: 10px; }
  .settingRow > span:first-child { font-size: 16px; white-space: nowrap; width: 56px; }
  .settingRow .btnRow { flex: 1; }
  .toggleBtn {
    flex: 1;
    height: 44px;
    font-size: 16px;
    border-radius: 10px;
    border: 2px solid var(--gold);
    background: var(--purple-dark);
    color: #fff;
    cursor: pointer;
  }
  .toggleBtn.active {
    background: linear-gradient(180deg, var(--gold), var(--orange));
    color: #2a1245;
    font-weight: bold;
  }

  /* 字體大小：特大模式 */
  #app.fontXL .score-value { font-size: 40px; }
  #app.fontXL .score-label { font-size: 17px; }
  #app.fontXL #messageBar { font-size: 20px; }
  #app.fontXL #launchBtn { font-size: 28px; height: 68px; }
  #app.fontXL .smallBtn, #app.fontXL .toggleBtn { font-size: 18px; height: 54px; }
  #app.fontXL #powerRow label, #app.fontXL #powerValue { font-size: 20px; }
  #app.fontXL #statsPanel, #app.fontXL .settingRow > span:first-child { font-size: 18px; }

  /* 二次確認 Modal */
  #confirmOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center; justify-content: center;
    z-index: 50;
  }
  #confirmOverlay.show { display: flex; }
  #confirmBox {
    background: var(--purple-mid);
    border: 3px solid var(--gold);
    border-radius: 14px;
    padding: 24px;
    max-width: 320px;
    text-align: center;
  }
  #confirmBox p { font-size: 18px; margin-bottom: 20px; }
  #confirmBox .btnRow { gap: 12px; }

  #feverBanner {
    display: none;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    color: var(--orange);
    background: #1a0a2e;
    padding: 6px;
    border-radius: 10px;
    animation: pulse 0.6s infinite alternate;
  }
  #feverBanner.show { display: block; }
  @keyframes pulse { from{opacity:1;} to{opacity:0.5;} }

  @media (prefers-reduced-motion: reduce) {
    #slotMachine.spinning .reel { animation: none; }
    #feverBanner { animation: none; }
  }
</style>
</head>
<body>
<div id="app">
  <h1>🎰 柏青哥 Pachinko 🎰</h1>

  <div id="scoreboard">
    <div class="score-item">
      <div class="score-label">籌碼</div>
      <div class="score-value" id="chipsValue">1000</div>
    </div>
    <div class="score-item">
      <div class="score-label">本次得分</div>
      <div class="score-value" id="sessionScoreValue">0</div>
    </div>
  </div>

  <div id="feverBanner">🔥 FEVER TIME 🔥</div>

  <div id="slotMachine">
    <div class="reel" id="reel0">🍒</div>
    <div class="reel" id="reel1">🍋</div>
    <div class="reel" id="reel2">⭐</div>
  </div>

  <div id="boardWrap">
    <canvas id="board" width="360" height="520"></canvas>
  </div>

  <div id="messageBar">按「發射」讓彈珠落下吧！</div>

  <div id="controls">
    <div id="powerRow">
      <label for="powerSlider">力道</label>
      <input type="range" id="powerSlider" min="0" max="100" value="50">
      <span id="powerValue">50</span>
    </div>
    <button id="launchBtn">🚀 發射（按住可連發）</button>
    <div class="btnRow">
      <button class="smallBtn" id="soundBtn">🔊 音效</button>
      <button class="smallBtn" id="statsBtn">📊 統計</button>
    </div>
    <div class="btnRow">
      <button class="smallBtn" id="settingsBtn">⚙️ 設定</button>
      <button class="smallBtn" id="resetBtn">🔄 重新開始</button>
    </div>
  </div>

  <div id="statsPanel">
    <div>歷史總得分：<b id="statTotalScore">0</b></div>
    <div>歷史 Fever 次數：<b id="statTotalFever">0</b></div>
    <div>歷史發射彈珠數：<b id="statTotalBalls">0</b></div>
  </div>

  <div id="settingsPanel">
    <div class="settingRow">
      <span>速度</span>
      <div class="btnRow">
        <button class="toggleBtn" data-gravity="1.2">慢</button>
        <button class="toggleBtn" data-gravity="1.6">中</button>
        <button class="toggleBtn" data-gravity="2.0">快</button>
      </div>
    </div>
    <div class="settingRow">
      <span>字體</span>
      <div class="btnRow">
        <button class="toggleBtn" data-font="normal">大</button>
        <button class="toggleBtn" data-font="xl">特大</button>
      </div>
    </div>
  </div>
</div>

<div id="confirmOverlay">
  <div id="confirmBox">
    <p>確定要重新開始嗎？<br>目前籌碼與紀錄將會清空。</p>
    <div class="btnRow">
      <button class="smallBtn" id="confirmYes">確定重來</button>
      <button class="smallBtn" id="confirmNo">取消</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 存檔 ----------
  const SAVE_KEY = 'pachinko_save_v1';
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function loadSave() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return null;
  }
  function defaultSave() {
    return {
      chips: 1000,
      totalScore: 0,
      totalFever: 0,
      totalBalls: 0,
      soundOn: true,
      gravity: 1.6,
      fontSize: 'normal',
      lastLoginDate: null
    };
  }
  let save = Object.assign(defaultSave(), loadSave() || {});

  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
  }

  // 每日登入禮
  let dailyGiftMsg = null;
  const today = todayStr();
  if (save.lastLoginDate !== today) {
    save.chips += 1000;
    save.lastLoginDate = today;
    dailyGiftMsg = '🎁 每日禮 +1000 籌碼！';
    persist();
  }

  // ---------- 遊戲狀態 ----------
  const gameState = {
    chips: save.chips,
    sessionScore: 0,
    feverCount: 0,
    isFever: false,
    feverEndTime: null,
    missStreak: 0,
    soundOn: save.soundOn,
  };

  // ---------- DOM ----------
  const chipsValueEl = document.getElementById('chipsValue');
  const sessionScoreValueEl = document.getElementById('sessionScoreValue');
  const messageBarEl = document.getElementById('messageBar');
  const launchBtn = document.getElementById('launchBtn');
  const powerSlider = document.getElementById('powerSlider');
  const powerValueEl = document.getElementById('powerValue');
  const soundBtn = document.getElementById('soundBtn');
  const statsBtn = document.getElementById('statsBtn');
  const resetBtn = document.getElementById('resetBtn');
  const statsPanel = document.getElementById('statsPanel');
  const boardWrap = document.getElementById('boardWrap');
  const feverBanner = document.getElementById('feverBanner');
  const slotMachineEl = document.getElementById('slotMachine');
  const reelEls = [document.getElementById('reel0'), document.getElementById('reel1'), document.getElementById('reel2')];
  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmYes = document.getElementById('confirmYes');
  const confirmNo = document.getElementById('confirmNo');
  const statTotalScore = document.getElementById('statTotalScore');
  const statTotalFever = document.getElementById('statTotalFever');
  const statTotalBalls = document.getElementById('statTotalBalls');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const appEl = document.getElementById('app');
  const gravityBtns = Array.from(document.querySelectorAll('[data-gravity]'));
  const fontBtns = Array.from(document.querySelectorAll('[data-font]'));

  function updateHud() {
    chipsValueEl.textContent = gameState.chips;
    sessionScoreValueEl.textContent = gameState.sessionScore;
    statTotalScore.textContent = save.totalScore;
    statTotalFever.textContent = save.totalFever;
    statTotalBalls.textContent = save.totalBalls;
  }
  function showMessage(msg) {
    messageBarEl.textContent = msg;
  }
  updateHud();
  if (dailyGiftMsg) showMessage(dailyGiftMsg);

  // ---------- 音效（Web Audio 合成） ----------
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function tone(freq, start, dur, type, gainVal) {
    if (!gameState.soundOn) return;
    const c = ctx();
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = gainVal != null ? gainVal : 0.15;
    osc.connect(gain).connect(c.destination);
    const t0 = c.currentTime + start;
    osc.start(t0);
    gain.gain.setValueAtTime(gain.gain.value, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.stop(t0 + dur + 0.02);
  }
  function sfxLaunch() { tone(440, 0, 0.05, 'sine', 0.12); }
  function sfxSmallHole() { tone(660, 0, 0.08, 'sine'); tone(880, 0.08, 0.1, 'sine'); }
  function sfxBigHole() { tone(880, 0, 0.08, 'sine'); tone(1100, 0.08, 0.08, 'sine'); tone(1320, 0.16, 0.12, 'sine'); }
  function sfx777() { tone(784, 0, 0.12, 'triangle'); tone(880, 0.1, 0.12, 'triangle'); tone(1047, 0.2, 0.12, 'triangle'); tone(1175, 0.3, 0.2, 'triangle'); }
  function sfxMiss() { tone(330, 0, 0.12, 'sawtooth', 0.06); }
  function sfxFeverStart() { tone(523, 0, 0.15, 'square'); tone(659, 0.1, 0.15, 'square'); tone(784, 0.2, 0.15, 'square'); tone(1047, 0.3, 0.3, 'square'); }
  function sfxRefill() { tone(880, 0, 0.1, 'sine'); tone(1100, 0.1, 0.15, 'sine'); }

  soundBtn.addEventListener('click', () => {
    gameState.soundOn = !gameState.soundOn;
    save.soundOn = gameState.soundOn;
    soundBtn.textContent = gameState.soundOn ? '🔊 音效' : '🔇 靜音';
    persist();
  });
  soundBtn.textContent = gameState.soundOn ? '🔊 音效' : '🔇 靜音';

  // ---------- Matter.js 物理設定 ----------
  const { Engine, World, Bodies, Body, Events, Composite } = Matter;
  const engine = Engine.create();
  engine.gravity.y = save.gravity;

  const CANVAS_W = 360, CANVAS_H = 520;
  const canvas = document.getElementById('board');
  const ctx2d = canvas.getContext('2d');

  const world = engine.world;

  // 邊界牆
  const wallOpts = { isStatic: true, restitution: 0.4, friction: 0.1, render: {} };
  World.add(world, [
    Bodies.rectangle(-5, CANVAS_H / 2, 10, CANVAS_H, wallOpts),
    Bodies.rectangle(CANVAS_W + 5, CANVAS_H / 2, 10, CANVAS_H, wallOpts),
  ]);

  // 釘板（交錯蜂巢式）
  const PIN_RADIUS = 4;
  const PIN_SPACING = 32;
  const PIN_ROWS = 12;
  const PIN_TOP = 60;
  const pins = [];
  for (let row = 0; row < PIN_ROWS; row++) {
    const y = PIN_TOP + row * 28;
    const offsetX = (row % 2 === 0) ? 0 : PIN_SPACING / 2;
    for (let col = 0; col < 10; col++) {
      const x = 20 + col * PIN_SPACING + offsetX;
      if (x < 16 || x > CANVAS_W - 16) continue;
      const pin = Bodies.circle(x, y, PIN_RADIUS, {
        isStatic: true,
        restitution: 0.6,
        friction: 0.05,
        label: 'pin'
      });
      pins.push(pin);
    }
  }
  World.add(world, pins);

  // 底部洞口設定
  const HOLE_Y = 495;
  const HOLE_H = 26;
  // [x中心, 寬度, 類型]
  const holeDefs = [
    { x: 30,  w: 44, type: 'small-outer' },
    { x: 90,  w: 44, type: 'small-inner' },
    { x: 165, w: 56, type: 'big' },
    { x: 225, w: 56, type: 'big' },
    { x: 285, w: 44, type: 'small-inner' },
    { x: 340, w: 44, type: 'small-outer' },
  ];
  const holeBodies = holeDefs.map(h => {
    const body = Bodies.rectangle(h.x, HOLE_Y, h.w, HOLE_H, {
      isStatic: true,
      isSensor: true,
      label: 'hole:' + h.type
    });
    body.holeDef = h;
    return body;
  });
  World.add(world, holeBodies);

  // ---------- 彈珠管理 ----------
  const balls = [];
  const BALL_RADIUS = 8;
  const BALL_COLORS = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3', '#f6e58d'];

  function spawnBall(power) {
    const spawnX = 340 - (power / 100) * 260 + (Math.random() * 10 - 5);
    const ball = Bodies.circle(spawnX, 30, BALL_RADIUS, {
      restitution: 0.55,
      friction: 0.02,
      frictionAir: 0.001,
      label: 'ball'
    });
    ball.scored = false;
    ball.spawnTime = Date.now();
    ball.color = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];
    Body.setVelocity(ball, { x: (Math.random() * 1.2 - 0.6), y: 2 });
    World.add(world, ball);
    balls.push(ball);
    save.totalBalls++;
  }

  function removeBall(ball) {
    const idx = balls.indexOf(ball);
    if (idx >= 0) balls.splice(idx, 1);
    World.remove(world, ball);
  }

  // ---------- 老虎機 ----------
  const SYMBOLS = ['7️⃣', '🍒', '🍋', '⭐', '🔔', '🍇', '💎'];
  let slotSpinning = false;

  function spinSlot(winProb) {
    if (slotSpinning) return;
    slotSpinning = true;
    slotMachineEl.classList.add('spinning');

    let forceWin = gameState.missStreak >= 40;
    let win = forceWin || Math.random() < winProb;

    let result;
    if (win) {
      result = ['7️⃣', '7️⃣', '7️⃣'];
    } else {
      result = [0, 0, 0].map(() => SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
      if (result[0] === result[1] && result[1] === result[2]) {
        result[2] = SYMBOLS[(SYMBOLS.indexOf(result[2]) + 1) % SYMBOLS.length];
      }
    }

    const spinIntervals = [];
    reelEls.forEach((el, i) => {
      spinIntervals[i] = setInterval(() => {
        el.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      }, 70);
    });

    const stopDelays = [600, 1000, 1400];
    reelEls.forEach((el, i) => {
      setTimeout(() => {
        clearInterval(spinIntervals[i]);
        el.textContent = result[i];
        if (i === reelEls.length - 1) {
          slotSpinning = false;
          slotMachineEl.classList.remove('spinning');
          if (win) {
            gameState.missStreak = 0;
            sfx777();
            showMessage('🎉 777 中獎！進入 FEVER！');
            startFever();
          } else {
            gameState.missStreak++;
            sfxMiss();
            showMessage('可惜，再試一次！');
          }
        }
      }, stopDelays[i]);
    });
  }

  // ---------- Fever ----------
  let feverTimer = null;
  function startFever() {
    gameState.isFever = true;
    gameState.feverCount++;
    save.totalFever++;
    gameState.feverEndTime = Date.now() + 30000;
    boardWrap.classList.add('fever');
    feverBanner.classList.add('show');
    sfxFeverStart();

    // 大入洞開口變大
    holeBodies.forEach(hb => {
      if (hb.holeDef.type === 'big' && !hb.scaledUp) {
        Body.scale(hb, 1.3, 1.0);
        hb.scaledUp = true;
      }
    });

    if (feverTimer) clearTimeout(feverTimer);
    feverTimer = setTimeout(endFever, 30000);
    persist();
  }
  function endFever() {
    gameState.isFever = false;
    gameState.feverEndTime = null;
    boardWrap.classList.remove('fever');
    feverBanner.classList.remove('show');
    holeBodies.forEach(hb => {
      if (hb.holeDef.type === 'big' && hb.scaledUp) {
        Body.scale(hb, 1 / 1.3, 1.0);
        hb.scaledUp = false;
      }
    });
    showMessage('Fever 結束，繼續加油！');
  }

  // ---------- 入洞處理 ----------
  const SCORE_TABLE = {
    'small-outer': { normal: 5, fever: 5 },
    'small-inner': { normal: 10, fever: 10 },
    'big': { normal: 50, fever: 150 }
  };

  function handleHole(ball, holeBody) {
    const type = holeBody.holeDef.type;
    const table = SCORE_TABLE[type];
    const score = gameState.isFever ? table.fever : table.normal;

    gameState.sessionScore += score;
    save.totalScore += score;

    if (type === 'big') {
      sfxBigHole();
      showMessage('🎯 大入洞！+' + score + ' 分');
      if (!gameState.isFever) {
        spinSlot(0.35);
      }
    } else {
      sfxSmallHole();
      showMessage('✨ 入洞！+' + score + ' 分');
      spinSlot(0.08);
    }

    updateHud();
    persist();
  }

  Events.on(engine, 'collisionStart', (event) => {
    event.pairs.forEach(pair => {
      const { bodyA, bodyB } = pair;
      let ballBody = null, holeBody = null;
      if (bodyA.label === 'ball' && String(bodyB.label).startsWith('hole:')) { ballBody = bodyA; holeBody = bodyB; }
      else if (bodyB.label === 'ball' && String(bodyA.label).startsWith('hole:')) { ballBody = bodyB; holeBody = bodyA; }
      if (ballBody && holeBody && !ballBody.scored) {
        ballBody.scored = true;
        handleHole(ballBody, holeBody);
        setTimeout(() => removeBall(ballBody), 80);
      }
    });
  });

  // ---------- 自動補籌碼 ----------
  function checkAutoRefill() {
    if (gameState.chips < 50) {
      gameState.chips += 500;
      save.chips = gameState.chips;
      sfxRefill();
      showMessage('🧧 幸運紅包！+500 籌碼');
      persist();
      updateHud();
    }
  }

  // ---------- 發射 ----------
  const BALL_COST = 5;
  function launchBall() {
    if (gameState.chips < BALL_COST) {
      checkAutoRefill();
      if (gameState.chips < BALL_COST) return;
    }
    gameState.chips -= BALL_COST;
    save.chips = gameState.chips;
    sfxLaunch();
    spawnBall(Number(powerSlider.value));
    updateHud();
    persist();
    checkAutoRefill();
  }

  launchBtn.addEventListener('click', launchBall);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      launchBall();
    }
  });
  powerSlider.addEventListener('input', () => {
    powerValueEl.textContent = powerSlider.value;
  });

  // ---------- 統計面板 ----------
  statsBtn.addEventListener('click', () => {
    statsPanel.classList.toggle('show');
  });

  // ---------- 設定面板：速度 / 字體 ----------
  settingsBtn.addEventListener('click', () => {
    settingsPanel.classList.toggle('show');
  });

  function syncSettingButtons() {
    gravityBtns.forEach(b => b.classList.toggle('active', Number(b.dataset.gravity) === save.gravity));
    fontBtns.forEach(b => b.classList.toggle('active', b.dataset.font === save.fontSize));
  }
  gravityBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const g = Number(btn.dataset.gravity);
      save.gravity = g;
      engine.gravity.y = g;
      syncSettingButtons();
      persist();
    });
  });
  fontBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      save.fontSize = btn.dataset.font;
      appEl.classList.toggle('fontXL', save.fontSize === 'xl');
      syncSettingButtons();
      persist();
    });
  });
  appEl.classList.toggle('fontXL', save.fontSize === 'xl');
  syncSettingButtons();

  // ---------- 連續發射模式（按住不放自動連發） ----------
  const AUTO_FIRE_DELAY = 400;
  const AUTO_FIRE_INTERVAL = 500;
  let autoFireTimeout = null;
  let autoFireInterval = null;
  function stopAutoFire() {
    if (autoFireTimeout) { clearTimeout(autoFireTimeout); autoFireTimeout = null; }
    if (autoFireInterval) { clearInterval(autoFireInterval); autoFireInterval = null; }
  }
  launchBtn.addEventListener('pointerdown', () => {
    stopAutoFire();
    autoFireTimeout = setTimeout(() => {
      autoFireInterval = setInterval(launchBall, AUTO_FIRE_INTERVAL);
    }, AUTO_FIRE_DELAY);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(evt => {
    launchBtn.addEventListener(evt, stopAutoFire);
  });

  // ---------- 重新開始（二次確認） ----------
  resetBtn.addEventListener('click', () => {
    confirmOverlay.classList.add('show');
  });
  confirmNo.addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
  });
  confirmYes.addEventListener('click', () => {
    confirmOverlay.classList.remove('show');
    save = defaultSave();
    save.lastLoginDate = todayStr();
    persist();
    gameState.chips = save.chips;
    gameState.sessionScore = 0;
    gameState.feverCount = 0;
    gameState.missStreak = 0;
    if (gameState.isFever) endFever();
    balls.slice().forEach(removeBall);
    updateHud();
    showMessage('已重新開始，繼續加油！');
  });

  // ---------- beforeunload 存檔 ----------
  window.addEventListener('beforeunload', () => {
    save.chips = gameState.chips;
    persist();
  });

  // ---------- 主迴圈 ----------
  function loop() {
    Engine.update(engine, 1000 / 60);

    // 回收出界彈珠（未入洞 = 0 分）
    for (let i = balls.length - 1; i >= 0; i--) {
      const b = balls[i];
      if (b.position.y > CANVAS_H + 20) {
        if (!b.scored) {
          showMessage('可惜，掉出去了，再接再厲！');
        }
        removeBall(b);
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  function render() {
    // 背景
    if (gameState.isFever) {
      const grad = ctx2d.createRadialGradient(CANVAS_W / 2, CANVAS_H / 2, 20, CANVAS_W / 2, CANVAS_H / 2, 300);
      grad.addColorStop(0, '#4a1f7a');
      grad.addColorStop(1, '#241041');
      ctx2d.fillStyle = grad;
    } else {
      ctx2d.fillStyle = '#241041';
    }
    ctx2d.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // 釘子
    ctx2d.fillStyle = gameState.isFever ? '#ff8c42' : '#d8c4ff';
    pins.forEach(p => {
      ctx2d.beginPath();
      ctx2d.arc(p.position.x, p.position.y, PIN_RADIUS, 0, Math.PI * 2);
      ctx2d.fill();
    });

    // 洞口
    holeBodies.forEach(hb => {
      const vertices = hb.vertices;
      const minX = Math.min(...vertices.map(v => v.x));
      const maxX = Math.max(...vertices.map(v => v.x));
      const minY = Math.min(...vertices.map(v => v.y));
      const maxY = Math.max(...vertices.map(v => v.y));
      const isBig = hb.holeDef.type === 'big';
      ctx2d.fillStyle = isBig ? '#ffcc4d' : '#8a6fd6';
      ctx2d.fillRect(minX, minY, maxX - minX, maxY - minY);
      ctx2d.fillStyle = '#2a1245';
      ctx2d.font = 'bold 11px sans-serif';
      ctx2d.textAlign = 'center';
      const label = isBig ? (gameState.isFever ? '+150' : '+50') : (hb.holeDef.type === 'small-inner' ? '+10' : '+5');
      ctx2d.fillText(label, (minX + maxX) / 2, (minY + maxY) / 2 + 4);
    });

    // 彈珠
    balls.forEach(b => {
      ctx2d.beginPath();
      ctx2d.arc(b.position.x, b.position.y, BALL_RADIUS, 0, Math.PI * 2);
      const grad = ctx2d.createRadialGradient(
        b.position.x - 2, b.position.y - 2, 1,
        b.position.x, b.position.y, BALL_RADIUS
      );
      grad.addColorStop(0, '#fff');
      grad.addColorStop(1, b.color);
      ctx2d.fillStyle = grad;
      ctx2d.fill();
    });
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
